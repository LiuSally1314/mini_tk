loop_count: 100

steps:
  # 第一步：点升级
  - action: find_click
    name: "升级按钮"
    text: "升级"
    expect_text: "建造"
    times: 1
    sleep: 0.2

  # 第二步：点加速（免费加速 / 加速，同位置，OR 匹配）
  - action: find_click
    name: "加速按钮"
    text: ["免费加速", "加速"]
    expect_text:
      mode: or
      keywords: ["建造"]
    times: 1
    sleep: 0.2

  # 第三步：点确定（免费时没有，找不到就跳过）
  - action: find_click
    name: "确定按钮"
    text: "确定"
    optional: true
    retry: 1
    retry_interval: 0.2
    sleep: 0.2