loop_count: 1

steps:

  - action: find_click
    name: "快速注册"
    text: "快速注册"
    times: 1
    sleep: 1

  - action: run_method
    remark: "输入注册信息"
    method: input_reg_account_info
    params:
      file:
        data/reg_account.json
    enabled: true


  # 第一步：点升级
  - action: find_click
    name: "升级按钮"
    text: "升级"
    times: 1
    sleep: 1

  # 第二步：点加速（免费加速 / 加速，同位置，OR 匹配）
  - action: find_click
    name: "加速按钮"
    text: ["免费加速", "加速"]
    times: 1
    sleep: 1

  - action: run_method
    remark: "升级建筑前，获取升级时间信息"
    method: save_upgrade_building_time_info
    params:
      file:
        data/upgrade_building_info.json
    enabled: true

  # 第三步：点确定（免费时没有，找不到就跳过）
  - action: find_click
    name: "确定按钮"
    text: "确定"
    optional: true
    retry: 1
    retry_interval: 0.2
    sleep: 1