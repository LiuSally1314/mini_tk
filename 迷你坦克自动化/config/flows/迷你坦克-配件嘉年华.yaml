# ============================================
# 流程：将领升级（1→40→50→60 + 两次突破 + 一次授勋）
#
# 全部为固定坐标点击，text 仅作日志说明。
# 注意：原文件 YAML 缩进有误（steps 前多了 4 个空格），此处已修正。
# ============================================
loop_count: 1000000

#end_time: "2026-10-01 07:30:00" # 到点强制停止
# end_time: "23:30:00"          # 只写时刻=当天
# end_time: ""                  # 空=无限制

steps:
  - action: click
    remark: "全民激活"
    target: coords
    coords: [ 849, 2231 ]
    times: 1

    sleep: 0

  - action: click
    remark: "确定"
    target: coords
    coords: [ 548, 2131 ]
    times: 1
    sleep: 0

