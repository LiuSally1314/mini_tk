loop_count: 500

steps:

  - action: run_method
    remark: "发送一个邮件"
    method: send_one_email
    enabled: true
    sleep: 1

  - action: find_click
    name: "点击第一个邮件"
    remark: "点击第一个邮件"
    text: "GM邮件"
    index: 0
    cache_ttl: 6000000
    times: 1
    sleep: 1

